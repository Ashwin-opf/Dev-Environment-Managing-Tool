[package]
name = "app"
version = "0.1.0"
description = "PC Doctor — Intelligent System Repair"
authors = ["PC Doctor"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri         = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
log           = "0.4"
rand          = "0.8"
reqwest       = { version = "0.12", features = ["json"] }
tokio         = { version = "1", features = ["full"] }
